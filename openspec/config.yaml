# openspec/config.yaml
schema: spec-driven

context: |
  Solución DESI.ConsultorioMedico.sln (raíz del repo) — migración de la app WinForms
  "Consultorio Médico" (NHibernate) a MVC 5 + WebApi sobre .NET Framework 4.8, "tal como funciona".
  Tech stack: .NET Framework 4.8, C# 7.3 (.cs) / Razor C# 5 (.cshtml).
  3 proyectos: ConsultorioMedicoEntities (entidades/DTOs/validadores/ModelResponse),
  ConsultorioMedicoWebApi (ASP.NET WebApi 5.3 + OWIN OAuth 2 password grant, ADO.NET + SPs),
  ConsultorioMedicoMVC (ASP.NET MVC 5.3, Bootstrap 5 + jQuery + DataTables + SweetAlert2).
  Data access: ADO.NET SOLO (SqlConnection/SqlCommand en DbWrapper.* parciales) vía SPs —
  NO ORM. NHibernate muere → todo por SPs; SP nuevo con prefijo sp_nh_.
  Frontend flujo: Vista (jQuery Validate + hidden inputs + serialize) → Controller MVC →
  Servicio MVC → HttpClientConnection (token OAuth en cookie) → Controller WebApi →
  Servicio WebApi → DbWrapper → BD productiva DB_9C7990_Consultorio (Smarterasp, no borrar nada).
  Convención obligatoria: PLAYBOOK.md en la raíz (checklist de módulos, patrón de formularios,
  validación en capas, gotchas). Referencia de arquitectura: ServiceDeskDESI.
  Respuesta: ModelResponse<T> (IsSuccess/Message/Response), HTTP 200 siempre, mensajes en español.
  Id = int. WebApi serializa camelCase; MVC PascalCase. Autenticación: OAuth2 bearer en cookie
  FormsAuthentication. Idioma de specs/artefactos: español. Módulos migrados: login, Paciente,
  Cita (FullCalendar), Consulta, Tratamiento, Paquete, Usuario, Anexo, Historial (parcial).
  Testing: no hay runner (sin xUnit); verificación = MSBuild + aspnet_compiler.

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions (PLAYBOOK.md)
    - Load relevant coding skills for the project stack (netframework-mvc-webapi)
    - Use ADO.NET only for data access via SPs (no ORM)
  verify:
    - Run MSBuild + aspnet_compiler as build verification
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: false
  detected: "2026-09-04"
  note: "No test runner present (MVC+WebApi .NET Framework 4.8, sin xUnit). Verificación = compilar solución con MSBuild + precompilar vistas con aspnet_compiler (ver PLAYBOOK.md §9)."
  test_runner:
    command: "& 'C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\MSBuild\\Current\\Bin\\amd64\\MSBuild.exe' 'DESI.ConsultorioMedico.sln' /t:Build /p:Configuration=Debug"
    framework: "none"
  layers:
    unit: "not installed"
    integration: "not installed"
    e2e: "not installed"
  coverage:
    available: false
    command: "-"
  quality:
    linter: "none"
    formatter: "none"
    type_checker: "MSBuild (compile-time) + aspnet_compiler (Razor views)"
