# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: .NET 10 (ASP.NET Core Web API), C#. Data access: ADO.NET only (SqlConnection/SqlCommand/SqlDataReader) — NO ORM (no EF Core, no Dapper). SQL Server 2019+. Logging: Serilog. API docs: Scalar (not Swagger).
  Architecture: Layered per domain (Dominio / Aplicacion / Infraestructura / Mensajes / Pruebas) + Common.* (Data/Http/Helpers/Mensajes) + WebApi. Solution DESI.ConsultorioMedico.sln, namespaces DESI.ConsultorioMedico.*. Active domain: Paciente; future: Usuario, Cita, Consulta, Tratamiento, Anexo.
  Patterns: Fluent Interface (Set returns this), Factory Method (private ctor + Create), Repository, DI, DTO, Static Mapper (Mapp). JWT auth, rate limiting (100 req/min), open CORS, logical deletes (Estatus).
  Testing: xUnit (planned, one project per domain) — no test project exists yet (greenfield repo, only specs committed).
  Style: Spanish naming for endpoints/classes/messages; DataAnnotations validation; error handling at Controller level (no global error middleware); ModelResponse<T> as public response envelope.

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    - Use ADO.NET only for data access (no ORM)
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: false
  detected: "2026-08-23"
  note: "No test runner present in code yet (greenfield). xUnit documented in project specs as the intended framework. Set strict_tdd: true once the first xUnit project exists."
  test_runner:
    command: "dotnet test"
    framework: "xUnit (planned — no test project exists yet)"
  layers:
    unit: "planned (xUnit, one project per domain)"
    integration: "not installed"
    e2e: "not installed"
  coverage:
    available: false
    command: "-"
  quality:
    linter: "none"
    formatter: "none"
    type_checker: "dotnet build (compile-time)"
